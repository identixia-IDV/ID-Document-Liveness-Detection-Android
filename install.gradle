import java.net.HttpURLConnection

// Identixia Document Liveness (liveness-only).
// The sample app applies this file and keeps using :libdocumentlivenesssdk when that module
// and documentlivenesssdk.aar are already in the repo (same dependency as before).
// An app that does not contain :libdocumentlivenesssdk downloads the Latest Release (tag latest → highest vX.Y.Z; assets not duplicated).
// The AAR already contains document.xdb.

def identixiaFinish = { File part, File dest ->
    Exception last = null
    for (int i = 0; i < 5; i++) {
        try {
            java.nio.file.Files.move(part.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            return
        } catch (Exception e) {
            last = e
            sleep(1000)
        }
    }
    throw last
}

def identixiaDownload = { String url, File dest ->
    dest.parentFile.mkdirs()
    File part = new File(dest.parentFile, dest.name + ".partial")
    Exception last = null
    for (int attempt = 1; attempt <= 8; attempt++) {
        HttpURLConnection conn = null
        try {
            long have = part.exists() ? part.length() : 0
            URL current = new URL(url)
            boolean resume = have > 0
            for (int hop = 0; hop < 6; hop++) {
                conn = (HttpURLConnection) current.openConnection()
                conn.setInstanceFollowRedirects(false)
                conn.setConnectTimeout(30_000)
                conn.setReadTimeout(600_000)
                conn.setRequestProperty("User-Agent", "identixia-gradle")
                conn.setRequestProperty("Accept", "application/octet-stream")
                if (resume && hop > 0) conn.setRequestProperty("Range", "bytes=${have}-")
                int code = conn.getResponseCode()
                if (code >= 300 && code < 400) {
                    String loc = conn.getHeaderField("Location")
                    conn.disconnect()
                    conn = null
                    if (loc == null) throw new IOException("HTTP ${code} without Location")
                    current = new URL(current, loc)
                    continue
                }
                if (code == 200) {
                    have = 0
                    resume = false
                } else if (code == 416) {
                    if (part.length() > 1024) {
                        identixiaFinish(part, dest)
                        return
                    }
                    part.delete()
                    throw new IOException("HTTP 416")
                } else if (code != 206) {
                    throw new IOException("HTTP ${code}")
                }
                logger.lifecycle("Identixia: ${dest.name} from ${have} bytes")
                InputStream input = conn.getInputStream()
                OutputStream out = new BufferedOutputStream(new FileOutputStream(part, have > 0))
                byte[] buf = new byte[1024 * 1024]
                int n
                long total = 0
                while ((n = input.read(buf)) != -1) {
                    out.write(buf, 0, n)
                    total += n
                }
                out.close()
                input.close()
                conn.disconnect()
                if (part.length() < 1024) throw new IOException("download too small (${part.length()} bytes)")
                identixiaFinish(part, dest)
                return
            }
            throw new IOException("too many redirects")
        } catch (Exception e) {
            last = e
            logger.warn("Identixia: download attempt ${attempt} failed: ${e.message}")
            try { conn?.disconnect() } catch (Exception ignored) {}
            if (attempt < 8) sleep(3000)
        }
    }
    throw new GradleException("Download failed: ${url}\n${last?.message}")
}

def identixiaVersion = "latest"
def identixiaAarName = "documentlivenesssdk.aar"
def identixiaRelease = "https://github.com/identixia-IDV/ID-Document-Liveness-Detection-Android/releases/latest/download/${identixiaAarName}"

def localModule = findProject(":libdocumentlivenesssdk")
def localAar = rootProject.file("libdocumentlivenesssdk/${identixiaAarName}")

if (localModule != null && localAar.exists()) {
    dependencies {
        implementation project(":libdocumentlivenesssdk")
    }
} else {
    def cache = new File(rootProject.projectDir, ".identixia/document")
    cache.mkdirs()
    def aarFile = new File(cache, identixiaAarName)
    if (!aarFile.exists() && localAar.exists()) {
        java.nio.file.Files.copy(localAar.toPath(), aarFile.toPath())
    }
    if (!aarFile.exists()) {
        aarFile.delete()
        logger.lifecycle("Identixia: downloading ${identixiaAarName} (${identixiaVersion})")
        try {
            identixiaDownload(identixiaRelease, aarFile)
        } catch (Exception e) {
            aarFile.delete()
            throw new GradleException(
                "Missing ${identixiaAarName}. Download failed: ${identixiaRelease}\n${e.message}"
            )
        }
    }
    if (!aarFile.exists() || aarFile.length() < 1024) {
        throw new GradleException("Missing ${identixiaAarName} after ${identixiaRelease}")
    }
    dependencies {
        implementation files(aarFile)
    }
}
